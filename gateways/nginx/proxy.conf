events {}

http {
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log debug;

  upstream service_auth {
    server service-auth:4000;
    keepalive 16;
  }

  upstream service_log {
    server service-log:4000;
    keepalive 16;
  }

  map $http_origin $cors_whitelist {
    default "";
    "~^https?://localhost:5173$"      $http_origin;
    "~^https?://app\.example\.com$"   $http_origin;
    "~^https?://admin\.example\.com$" $http_origin;
  }

  map $cors_enabled $cors_allow_origin {
    default "";
    1 $cors_whitelist;
  }

  map "$cors_enabled:$http_origin:$cors_whitelist" $cors_block {
    default 0;
    "~^1:.+:$" 1;
  }

  server {
    listen 80;

    set $cors_enabled 1;

    location /_auth_verify/ {
      internal;

      proxy_pass http://service_auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Content-Type "";

      proxy_set_header Authorization $http_authorization;

      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;

      proxy_hide_header X-User-Id;
      proxy_hide_header X-User-Roles;

      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
      proxy_send_timeout 2s;
    }

    error_page 401 = @error401;
    error_page 403 = @error403;

    location @error401 { return 401 "Unauthorized\n"; }
    location @error403 { return 403 "Forbidden\n"; }

    location /auth/ {
      if ($cors_block) { return 403; }

      if ($cors_allow_origin != "") {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
        add_header Vary "Origin" always;
      }

      if ($request_method = OPTIONS) { return 204; }

      proxy_pass http://service_auth/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header X-User-Id   "";
      proxy_set_header X-User-Roles "";
    }

    location /log/ {
      if ($cors_block) { return 403; }

      if ($cors_allow_origin != "") {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
        add_header Vary "Origin" always;
      }

      if ($request_method = OPTIONS) { return 204; }

      set $auth_user_id "";
      set $auth_user_roles "";

      auth_request /_auth_verify/;

      auth_request_set $auth_user_id    $upstream_http_x_user_id;
      auth_request_set $auth_user_roles $upstream_http_x_user_roles;

      proxy_pass http://service_log/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header X-User-Id    $auth_user_id;
      proxy_set_header X-User-Roles $auth_user_roles;
    }

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
